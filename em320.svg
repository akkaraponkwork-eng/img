<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320">
  <style>
    /* แก้ไข: เอา stroke: #color ออก ให้เหลือแค่ stroke-opacity */
    @keyframes blink-border {
      0% { stroke-opacity: 1; }
      50% { stroke-opacity: 0.3; }
      100% { stroke-opacity: 1; }
    }
    
    .alert-border {
      animation: blink-border 1.5s infinite ease-in-out;
    }
  </style>

  <g transform="translate(25, 35)">
    <rect x="0" y="0" width="150" height="250" rx="15" 
          fill="#FFFFFF" 
          stroke="#c2c2c2" 
          stroke-width="20" 
          class="alert-border"/>
    
    <text x="75" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-style="italic" font-size="18" fill="#555" text-anchor="middle">Milesight</text>
    
    <g fill="#EFEFEF">
      <rect x="15" y="160" width="120" height="5" rx="2.5"/>
      <rect x="15" y="170" width="120" height="5" rx="2.5"/>
      <rect x="15" y="180" width="120" height="5" rx="2.5"/>
      <rect x="15" y="190" width="120" height="5" rx="2.5"/>
      <rect x="15" y="200" width="120" height="5" rx="2.5"/>
      <rect x="15" y="210" width="120" height="5" rx="2.5"/>
      <rect x="15" y="220" width="120" height="5" rx="2.5"/>
    </g>
  </g>

</svg>
