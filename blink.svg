<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes blinker {

            0%,
            to {
                opacity: 1
            }

            50% {
                opacity: .3
            }
        }
    </style>
    <circle cx="50" cy="50" r="40" stroke="#000"
        stroke-width="5" />
    <circle cx="50" cy="50" r="40" style="animation:blinker 1.5s infinite ease-in-out" fill="#73bf69" stroke="#000"
        stroke-width="5" />
</svg>