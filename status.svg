<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="display:block;">
    <style>
        @keyframes blink-stroke {
            0% { stroke-opacity: 1; }
            50% { stroke-opacity: 0; }
            100% { stroke-opacity: 1; }
        }
    </style>
    
    <rect x="2.5" y="2.5" width="30" height="80" 
          fill="none" 
          stroke="#c4c4c4" 
          stroke-width="10" 
          vector-effect="non-scaling-stroke"
          style="animation: blink-stroke 1s infinite ease-in-out;" />
</svg>